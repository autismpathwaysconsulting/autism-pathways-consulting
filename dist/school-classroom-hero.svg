<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" role="img" aria-labelledby="title desc">
<title id="title">Inclusive classroom learning scene</title>
<desc id="desc">A teacher and three students share a classroom task, with a visual schedule, a clear whiteboard and accessible learning materials.</desc>
<defs>
 <linearGradient id="back" x2="1" y2="1"><stop stop-color="#084f49"/><stop offset="1" stop-color="#032f2d"/></linearGradient>
 <linearGradient id="wall" x2=".7" y2="1"><stop stop-color="#fffdf5"/><stop offset="1" stop-color="#dcece2"/></linearGradient>
 <linearGradient id="teal" x2=".8" y2="1"><stop stop-color="#24aa96"/><stop offset="1" stop-color="#08655d"/></linearGradient>
 <linearGradient id="coral" x2=".6" y2="1"><stop stop-color="#ffbd92"/><stop offset="1" stop-color="#dc795c"/></linearGradient>
 <linearGradient id="sage" x2=".8" y2="1"><stop stop-color="#a8cbaa"/><stop offset="1" stop-color="#4b8468"/></linearGradient>
 <linearGradient id="blue" x2="1" y2="1"><stop stop-color="#8dc1cb"/><stop offset="1" stop-color="#397990"/></linearGradient>
 <linearGradient id="wood" x2="0" y2="1"><stop stop-color="#efc394"/><stop offset="1" stop-color="#b57f56"/></linearGradient>
 <linearGradient id="paper" x2=".6" y2="1"><stop stop-color="#fff"/><stop offset="1" stop-color="#e6efe6"/></linearGradient>
 <radialGradient id="light"><stop stop-color="#88d7b8" stop-opacity=".48"/><stop offset="1" stop-color="#88d7b8" stop-opacity="0"/></radialGradient>
 <filter id="roomShadow" x="-20%" y="-20%" width="150%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="15" flood-color="#001c1a" flood-opacity=".28"/></filter>
 <filter id="lift" x="-25%" y="-25%" width="160%" height="170%"><feDropShadow dx="0" dy="7" stdDeviation="5" flood-color="#073734" flood-opacity=".2"/></filter>
</defs>
