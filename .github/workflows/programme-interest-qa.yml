name: Programme interest QA
on:
  pull_request:
    paths:
      - 'programmes*'
      - 'resources.html'
      - 'programme-interest.js'
      - 'programme-explorer.js'
      - 'programme-*.webp'
      - 'functions/**'
      - 'content-os/programmes/**'
      - 'migrations/0012_programme_interest.sql'
      - 'tests/*authority*.py'
      - 'tests/website_authority.json'
      - 'wrangler.jsonc'
      - 'tests/programme*'
      - 'tests/programmes/**'
      - 'scripts/check-programme-live.mjs'
      - '.github/workflows/programme-interest-qa.yml'
permissions:
  contents: read
jobs:
  programme-interest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: python3 tests/validate_website_authority.py
      - run: python3 tests/run_authority_tests.py
      - run: npm run build
      - run: node --test tests/programme-interest.test.mjs tests/programme-resources.test.mjs tests/site-build-output.test.mjs tests/audience-navigation.test.mjs tests/school-topic-journey.test.mjs
      - name: Install browser test tools outside the repository
        run: npm install --prefix /tmp/apc-browser playwright@1.61.0
      - run: /tmp/apc-browser/node_modules/.bin/playwright install --with-deps chromium
      - name: Test mobile and desktop journeys against local SQLite
        env:
          NODE_PATH: /tmp/apc-browser/node_modules
          APC_QA_OUTPUT: qa/programmes
        run: |
          node tests/programmes/preview.mjs > /tmp/apc-programme-preview.log 2>&1 &
          node tests/programmes/browser.cjs
          node tests/programmes/site-sync-browser.cjs
          node scripts/check-programme-live.mjs http://localhost:8899 open
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: programme-interest-review
          path: qa/programmes
